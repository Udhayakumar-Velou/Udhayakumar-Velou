<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140" role="img" aria-label="Animated terminal footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="wave-clip"><rect width="800" height="140"/></clipPath>
    <clipPath id="type-clip">
      <rect x="270" y="62" height="34" width="0">
        <animate attributeName="width" values="0;259" dur="2.6s" begin="0.4s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="140" fill="#0d1117"/>

  <g clip-path="url(#wave-clip)">
    <path d="M0 34 Q100.0 20 200.0 34 T400.0 34 T600.0 34 T800.0 34 T1000.0 34 T1200.0 34 T1400.0 34 T1600.0 34 T1800.0 34 T2000.0 34 V140 H0 Z" fill="url(#fade)" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 34 Q100.0 20 200.0 34 T400.0 34 T600.0 34 T800.0 34 T1000.0 34 T1200.0 34 T1400.0 34 T1600.0 34 T1800.0 34 T2000.0 34" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M0 44 Q100.0 34 200.0 44 T400.0 44 T600.0 44 T800.0 44 T1000.0 44 T1200.0 44 T1400.0 44 T1600.0 44 T1800.0 44 T2000.0 44" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.4">
      <animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="13s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="270" y="86" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="18" fill="#00ff41" clip-path="url(#type-clip)">$ thanks for stopping by</text>

  <rect y="68" width="10" height="22" fill="#00ff41">
    <animate attributeName="x" from="270" to="529" dur="2.6s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3s" repeatCount="indefinite"/>
  </rect>

  <text x="400.0" y="124" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="11" fill="#8b949e">exit 0</text>
</svg>
